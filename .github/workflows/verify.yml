name: Verify atlas and static publication
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/export_pages.py
      - name: Ensure committed Pages output is current
        run: git diff --exit-code -- index.html site-data .nojekyll
      - name: Check Web modules
        run: |
          for module in static/viewer.js static/data-source.js static/materials.js static/performance.js static/batch-renderer.js static/batch-worker.js; do
            node --input-type=module --check < "$module"
          done
      - run: node tools/resolution-smoke.cjs
